name: Slow Tests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  # Skip the scheduled run when the default branch saw no commits since the
  # previous nightly window — no activity means yesterday's results still
  # stand.  Manual dispatch always runs.
  check-activity:
    name: Check for recent activity
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for commits in the last 24 hours
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commits in the last 24 hours; skipping slow suite."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  run-slow-tests:
    name: Run Slow Test Suite
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci-env:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Bazel versions
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazelisk
          key: bazel-version-${{ hashFiles('.bazelversion') }}

      - name: Cache Bazel build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
          key: bazel-slow-v2-${{ hashFiles('.bazelversion', 'MODULE.bazel') }}-${{ github.sha }}
          restore-keys: |
            bazel-slow-v2-${{ hashFiles('.bazelversion', 'MODULE.bazel') }}-
            bazel-slow-v2-

      - name: Build all targets
        run: bazel build //... --build_tag_filters=-benchmark

      - name: Run slow test suite
        run: |
          # Run only tests tagged as slow
          bazel test //tests/... --test_output=errors --test_tag_filters=slow

      - name: Display test results
        if: always()
        run: |
          if [ -d "bazel-testlogs" ]; then
            echo "Test results:"
            find bazel-testlogs -name "test.log" -exec echo "--- {} ---" \; -exec cat {} \;
          fi
